<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Policy-Aware Support Agent</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <header>
      <h1>Policy-Aware Support Agent</h1>
      <p class="sub">Answers grounded in the loan, KYC and EMI policy documents. Model: {{ model }}</p>
    </header>

    <form id="form">
      <textarea id="question" rows="3" placeholder="Ask a customer question, e.g. Will I be charged a foreclosure fee?"></textarea>
      <button type="submit" id="submit">Ask</button>
    </form>

    <div class="samples">
      <span>Try:</span>
      <button class="chip" type="button">Will I be charged a foreclosure fee on my floating rate home loan?</button>
      <button class="chip" type="button">How do I update my registered mobile number?</button>
      <button class="chip" type="button">Can I move my EMI date to the 20th?</button>
      <button class="chip" type="button">What interest rate will I get on a two wheeler loan?</button>
    </div>

    <section id="result" hidden>
      <div class="badges">
        <span class="badge" id="action"></span>
        <span class="badge" id="confidence"></span>
        <span class="badge" id="category"></span>
      </div>
      <p id="answer"></p>
      <p class="source" id="source"></p>
      <details>
        <summary>Why this answer</summary>
        <pre id="diagnostics"></pre>
      </details>
    </section>
  </main>

  <script>
    const form = document.getElementById('form');
    const box = document.getElementById('question');
    const button = document.getElementById('submit');
    const result = document.getElementById('result');

    document.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => { box.value = chip.textContent; form.requestSubmit(); };
    });

    form.onsubmit = async (event) => {
      event.preventDefault();
      const question = box.value.trim();
      if (!question) return;

      button.disabled = true;
      button.textContent = 'Thinking...';
      try {
        const response = await fetch('/ask', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({question})
        });
        show(await response.json());
      } catch (err) {
        show({action: 'escalate', confidence: 'low', category: 'other',
              answer: 'Could not reach the server: ' + err, source: '', diagnostics: {}});
      }
      button.disabled = false;
      button.textContent = 'Ask';
    };

    function show(data) {
      const action = document.getElementById('action');
      action.textContent = data.action;
      action.className = 'badge ' + (data.action === 'respond' ? 'ok' : 'warn');
      document.getElementById('confidence').textContent = data.confidence + ' confidence';
      document.getElementById('category').textContent = data.category;
      document.getElementById('answer').textContent = data.answer;
      document.getElementById('source').textContent = data.source ? 'Source: ' + data.source : '';
      document.getElementById('diagnostics').textContent =
        JSON.stringify(data.diagnostics || {}, null, 2);
      result.hidden = false;
    }
  </script>
</body>
</html>
